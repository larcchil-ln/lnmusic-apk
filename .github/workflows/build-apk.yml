# Taruh di repo lnmusic-apk sebagai: .github/workflows/build-apk.yml
# Lalu buka tab Actions -> "Build APK" -> Run workflow. APK muncul di bagian Artifacts.
name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # Capacitor 7 butuh 21. Kalau proyekmu Capacitor 5/6, ganti ke '17'.

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pasang dependensi & sinkron Capacitor
        run: |
          if [ -f package.json ]; then npm install; fi
          if [ -f capacitor.config.json ] || [ -f capacitor.config.ts ] || [ -f capacitor.config.js ]; then npx cap sync android || true; fi

      - name: Build APK debug
        run: |
          G=$(find . -name gradlew -not -path '*/node_modules/*' | head -n1)
          test -n "$G" || { echo "gradlew tidak ditemukan"; exit 1; }
          D=$(dirname "$G")
          chmod +x "$G"
          cd "$D" && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LNMusic-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
