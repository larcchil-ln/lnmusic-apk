# Taruh sebagai .github/workflows/build-apk.yml di repo lnmusic-apk (timpa isi yang lama).
# Kalau file lnmusic-main-final.zip ada di root repo ini, web yang dibundel ke APK diambil dari situ.
# Kalau tidak ada, web diambil dari repo lnmusic (branch web_ref).
name: Build APK
on:
  workflow_dispatch:
    inputs:
      web_ref:
        description: 'Branch repo web (dipakai hanya kalau tidak ada lnmusic-main-final.zip)'
        default: 'main'
  push:
    branches: [main]
    paths:
      - 'patch-android.py'
      - 'lnmusic-apk.zip'
      - 'lnmusic-main-final.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan source web
        run: |
          if [ -f lnmusic-main-final.zip ]; then
            mkdir web-tmp && unzip -q lnmusic-main-final.zip -d web-tmp
            D=$(dirname "$(find web-tmp -maxdepth 3 -name index.html | head -n1)")
            mv "$D" web-source
          else
            git clone --depth 1 --branch "${{ github.event.inputs.web_ref || 'main' }}" https://github.com/larcchil-ln/lnmusic.git web-source
          fi
          test -f web-source/index.html && test -f web-source/ln-local.js

      - name: Siapkan proyek Android
        run: |
          ls -la lnmusic-apk.zip
          unzip -l lnmusic-apk.zip | head -25
          unzip -q lnmusic-apk.zip -d project
          # Kalau isi zip ada di dalam satu folder, naikkan ke project/
          C=$(find project -maxdepth 3 -name capacitor.config.json | head -n1)
          if [ -z "$C" ]; then
            echo "capacitor.config.json tidak ada di lnmusic-apk.zip. Isi project:"; find project -maxdepth 3 | head -50; exit 1
          fi
          if [ "$(dirname "$C")" != "project" ]; then
            mv project project-old && mv "$(dirname "$C")" project
          fi
          mkdir -p project/www
          rsync -a --delete --exclude '.git' --exclude 'api' web-source/ project/www/
          python3 patch-android.py project
          # Request jaringan lewat HTTP native supaya tidak kena CORS dari origin https://localhost
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('project/capacitor.config.json')
          c = json.loads(p.read_text(encoding='utf-8'))
          c.setdefault('plugins', {})['CapacitorHttp'] = {'enabled': True}
          p.write_text(json.dumps(c, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cd project
          npm install
          npx cap add android
          python3 android-overlay/apply.py
          npx cap sync android

      - name: Build APK debug
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LNMusic-debug-apk
          path: project/android/app/build/outputs/apk/debug/*.apk
