name: Build APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "lnmusic-apk.zip"
      - "patch-android.py"
  workflow_dispatch:
    inputs:
      website_ref:
        description: "Branch website LNMusic yang akan dibundel"
        required: false
        default: "feat/offline-library-redesign"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek dari zip
        working-directory: .
        run: unzip -q lnmusic-apk.zip -d project

      - name: Ambil website LNMusic terbaru dan bundel secara lokal
        working-directory: .
        env:
          WEBSITE_REF: ${{ inputs.website_ref || 'feat/offline-library-player-lyrics-sync' }}
        run: |
          git clone --depth 1 --branch "$WEBSITE_REF" https://github.com/larcchil-ln/lnmusic.git web-source
          echo "Website ref: $WEBSITE_REF"
          git -C web-source rev-parse HEAD
          mkdir -p project/www
          rsync -a --delete --exclude='.git' web-source/ project/www/
          test -s project/www/index.html
          grep -q 'ln-local.js' project/www/index.html
          grep -q 'SYNC_LOCAL_TRACK' project/www/ln-local.js
          grep -q 'roomSyncHookTimer' project/www/ln-local.js
          grep -q 'ln-now-playing' project/www/index.html
          grep -q 'ln-player-expand' project/www/index.html
          grep -q 'ln-library-sidebar' project/www/index.html
          grep -q 'ln-alphabet' project/www/index.html
          grep -q 'ln-np-timer' project/www/ln-local.js
          grep -q 'data-lyrics-signature' project/www/ln-local.js
          grep -q 'api/search?q=' project/www/ln-local.js
          grep -q 'itunes.apple.com/search' project/www/ln-local.js
          grep -q 'getArtwork' patch-android.py
          grep -q 'android.graphics.BitmapFactory' patch-android.py
          grep -q 'ln-np-queue' project/www/ln-local.js
          grep -q 'Tambah ke antrean' project/www/ln-local.js
          rm -rf web-source

      - name: Aktifkan HTTP native Capacitor dan perbaiki pengambilan TURN di APK
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = Path("project/capacitor.config.json")
          data = json.loads(cfg.read_text())
          data.setdefault("plugins", {}).setdefault("CapacitorHttp", {})["enabled"] = True
          cfg.write_text(json.dumps(data, indent=2) + "\\n")
          p = Path("project/www/index.html")
          src = p.read_text()
          old = """    async function fetchTurn() {
                const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 7000);
                try {
                  const r = await fetch('/api/turn', { signal: ctrl.signal, cache: 'no-store' });
                  const j = await r.json().catch(() => null);
                  if (!r.ok) throw new Error((j && j.error) || 'HTTP ' + r.status);
                  if (!j || !Array.isArray(j.iceServers) || !j.iceServers.length) throw new Error('Respons kosong');
                  return j.iceServers;
                } finally { clearTimeout(t); }
              }"""
          new = """    async function fetchTurn() {
                const url = 'https://lnmusic.web.id/api/turn';
                const C = window.Capacitor;
                const native = !!(C && ((C.isNativePlatform && C.isNativePlatform()) || (C.getPlatform && C.getPlatform() !== 'web')));
                const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 12000);
                try {
                  const http = native && C && C.Plugins && C.Plugins.CapacitorHttp;
                  if (http && typeof http.request === 'function') {
                    const response = await http.request({ url, method: 'GET', headers: { 'Cache-Control': 'no-cache' }, connectTimeout: 10000, readTimeout: 10000 });
                    let j = response && response.data;
                    if (typeof j === 'string') { try { j = JSON.parse(j); } catch (_) { j = null; } }
                    if (!response || response.status < 200 || response.status >= 300) throw new Error((j && j.error) || ('HTTP ' + (response && response.status || 'gagal')));
                    if (!j || !Array.isArray(j.iceServers) || !j.iceServers.length) throw new Error('Respons TURN kosong');
                    return j.iceServers;
                  }
                  const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store', mode: 'cors' });
                  const j = await r.json().catch(() => null);
                  if (!r.ok) throw new Error((j && j.error) || 'HTTP ' + r.status);
                  if (!j || !Array.isArray(j.iceServers) || !j.iceServers.length) throw new Error('Respons kosong');
                  return j.iceServers;
                } finally { clearTimeout(t); }
              }"""
          if old not in src:
              raise SystemExit("fetchTurn source tidak cocok; build dihentikan agar tidak merusak file.")
          p.write_text(src.replace(old, new, 1))
          print("CapacitorHttp enabled; fetchTurn patched for Android native HTTP.")
          PY

      - name: Terapkan perbaikan bridge, izin, dan pemindai multi-volume
        working-directory: .
        run: python3 patch-android.py project

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Buat proyek Android
        run: npx cap add android

      - name: Tempel kode LNMusic (izin, layanan latar, ikon)
        run: python3 android-overlay/apply.py

      - name: Sinkronkan
        run: npx cap sync android

      - name: Validasi JavaScript LNMusic
        run: node --check www/ln-local.js

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: LNMusic-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan APK di Releases (unduhan langsung)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp project/android/app/build/outputs/apk/debug/app-debug.apk LNMusic.apk
          gh release create "apk-${{ github.run_number }}" LNMusic.apk --repo "${{ github.repository }}" --title "LNMusic APK #${{ github.run_number }}" --notes "Build otomatis dari GitHub Actions."

# Rebuild with the latest LNMusic library and player layout refinements.
