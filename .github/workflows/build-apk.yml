name: Build APK

on:
  workflow_dispatch:
    inputs:
      website_ref:
        description: "Branch website LNMusic yang akan dibundel"
        required: false
        default: "feat/offline-library-redesign"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek dari zip
        working-directory: .
        run: unzip -q lnmusic-apk.zip -d project

      - name: Ambil website LNMusic terbaru dan bundel secara lokal
        working-directory: .
        env:
          WEBSITE_REF: ${{ inputs.website_ref || 'feat/offline-library-player-lyrics-sync' }}
        run: |
          git clone --depth 1 --branch "$WEBSITE_REF" https://github.com/larcchil-ln/lnmusic.git web-source
          echo "Website ref: $WEBSITE_REF"
          git -C web-source rev-parse HEAD
          mkdir -p project/www
          rsync -a --delete --exclude='.git' web-source/ project/www/
          test -s project/www/index.html
          grep -q 'ln-local.js' project/www/index.html
          grep -q 'SYNC_LOCAL_TRACK' project/www/ln-local.js
          grep -q 'roomSyncHookTimer' project/www/ln-local.js
          grep -q 'ln-now-playing' project/www/index.html
          grep -q 'ln-player-expand' project/www/index.html
          grep -q 'ln-library-sidebar' project/www/index.html
          grep -q 'ln-alphabet' project/www/index.html
          grep -q 'ln-np-timer' project/www/ln-local.js
          grep -q 'data-lyrics-signature' project/www/ln-local.js
          grep -q 'api/search?q=' project/www/ln-local.js
          grep -q 'itunes.apple.com/search' project/www/ln-local.js
          grep -q 'getArtwork' patch-android.py
          grep -q 'android.graphics.BitmapFactory' patch-android.py
          grep -q 'ln-np-queue' project/www/ln-local.js
          grep -q 'Tambah ke antrean' project/www/ln-local.js
          rm -rf web-source

      - name: Terapkan perbaikan bridge, izin, dan pemindai multi-volume
        working-directory: .
        run: python3 patch-android.py project

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Buat proyek Android
        run: npx cap add android

      - name: Tempel kode LNMusic (izin, layanan latar, ikon)
        run: python3 android-overlay/apply.py

      - name: Integrasikan background voice call dan native PiP
        working-directory: .
        run: python3 apply-background-calls-pip.py

      - name: Sinkronkan
        run: npx cap sync android

      - name: Validasi JavaScript LNMusic
        run: node --check www/ln-local.js

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: LNMusic-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan APK di Releases (unduhan langsung)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp project/android/app/build/outputs/apk/debug/app-debug.apk LNMusic.apk
          gh release create "apk-${{ github.run_number }}" LNMusic.apk --repo "${{ github.repository }}" --title "LNMusic APK #${{ github.run_number }}" --notes "Build otomatis dari GitHub Actions."

# Rebuild with the latest LNMusic library and player layout refinements.
