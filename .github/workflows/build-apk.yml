# Ganti isi .github/workflows/build-apk.yml di repo lnmusic-apk dengan file ini.
name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tampilkan isi repo (untuk diagnosis)
        run: find . -maxdepth 3 -not -path './.git*' -not -path '*/node_modules*' | sort | head -100

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # kalau proyek Capacitor 5/6 atau Gradle lama, ganti ke '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pasang dependensi Node (kalau ada)
        run: |
          if [ -f package.json ]; then npm install; fi
          if [ -f package.json ] && ls capacitor.config.* >/dev/null 2>&1; then npx cap sync android || true; fi

      - name: Build APK debug
        run: |
          S=$(find . \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/node_modules/*' | head -n1)
          test -n "$S" || { echo "Tidak ada proyek Android (settings.gradle) di repo ini"; exit 1; }
          D=$(dirname "$S")
          cd "$D"
          if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi

      - uses: actions/upload-artifact@v4
        with:
          name: LNMusic-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
